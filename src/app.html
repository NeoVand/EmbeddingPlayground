<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>Embedding Playground</title>
		<meta
			name="description"
			content="An interactive 3D playground for understanding text-embedding models — compare, trace, retrieve, classify, and cluster, all running locally in your browser on WebGPU."
		/>
		<!-- Open Graph / social sharing -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Embedding Playground" />
		<meta
			property="og:description"
			content="An interactive 3D playground for understanding text-embedding models — runs entirely in your browser on WebGPU. No server, no API keys."
		/>
		<meta property="og:url" content="https://neovand.github.io/EmbeddingPlayground/" />
		<meta property="og:image" content="https://neovand.github.io/EmbeddingPlayground/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Embedding Playground" />
		<meta
			name="twitter:description"
			content="An interactive 3D playground for understanding text-embedding models — runs entirely in your browser on WebGPU."
		/>
		<meta name="twitter:image" content="https://neovand.github.io/EmbeddingPlayground/og.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
